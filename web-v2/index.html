<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F12" />
    <title>余粮 · 家有余粮,心里不慌</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__errs = [];
      window.addEventListener('error', function (e) { window.__errs.push(String(e.message) + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno); });
      window.addEventListener('unhandledrejection', function (e) { window.__errs.push('rej: ' + String(e.reason && e.reason.stack || e.reason)); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
